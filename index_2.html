<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>لاسلكي · جدول مهام اليوم</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#08090c;--panel:#101319;--card:#171b23;--line:#262c38;--ink:#eef1f8;--mut:#8590a6;--gold:#f2b53a;--tx:#ff3b3b;--rx:#2fe08f;--yes:#2fe08f;--no:#ff4d4f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(800px 500px at 40% 0%,#161b27,var(--bg));color:var(--ink);font-family:-apple-system,"SF Pro Text","Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif}
.app{display:flex;direction:ltr;height:100%;height:100dvh}
.main{flex:1;min-width:0;direction:rtl;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px}
.chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 15px;font-size:13px;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;background:#555}
.chip.on .dot{background:var(--rx);box-shadow:0 0 10px var(--rx)}
/* ---- police speaker-mic ---- */
.stage{position:relative;padding-top:126px}
.cord{position:absolute;left:50%;top:0;width:60px;height:100px;transform:translateX(-50%);z-index:0;pointer-events:none;-webkit-mask-image:linear-gradient(transparent,#000 38%);mask-image:linear-gradient(transparent,#000 38%)}
.stage .mic{z-index:1}
.mic{position:relative;display:block;width:min(66vw,260px);aspect-ratio:1;border:0;padding:0;border-radius:28px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
background:linear-gradient(155deg,#3a3d44 0%,#17191d 38%,#090a0c 100%);
box-shadow:0 0 0 3px #040405,0 0 0 5px #2c3038,0 30px 55px #000c,inset 0 2px 2px #ffffff30,inset 0 -12px 20px #000;
transition:transform .07s,box-shadow .12s}
.mic::before{content:"";position:absolute;left:50%;top:-34px;width:34px;height:34px;transform:translateX(-50%);background:repeating-linear-gradient(0deg,#0b0b0c 0 5px,#26282c 5px 8px);border-radius:6px 6px 0 0}
.grille{position:absolute;top:10%;left:12%;right:12%;height:44%;border-radius:18px;background:radial-gradient(circle,#000 36%,#0000 40%) 0 0/13px 13px,#2d3037;box-shadow:inset 0 4px 10px #000,0 1px 0 #ffffff26}
.led{position:absolute;top:5.5%;right:9%;width:13px;height:13px;border-radius:50%;background:#2a0d0d;box-shadow:inset 0 1px 2px #000,0 1px 0 #ffffff22}
.ridge{position:absolute;bottom:9%;left:12%;right:12%;height:28%;border-radius:16px;background:repeating-linear-gradient(90deg,#08090a 0 7px,#202226 7px 11px);box-shadow:inset 0 3px 8px #000,0 1px 0 #ffffff1c;display:grid;place-items:center}
.ridge b{font-size:20px;letter-spacing:.35em;color:#9aa0ac;text-shadow:0 -1px 0 #000,0 1px 0 #ffffff26;padding-right:.35em;background:#0b0c0e;border-radius:8px;padding:3px 3px 3px calc(.35em + 3px)}
.stage.tx .mic,.mic:active{transform:translateY(6px) scale(.985);box-shadow:0 0 0 3px #040405,0 0 0 5px #ff3b3b,0 0 40px #ff3b3b66,0 14px 30px #000c,inset 0 -6px 14px #000}
.stage.tx .led{background:var(--tx);box-shadow:0 0 14px 3px var(--tx)}
.stage.rx .mic{box-shadow:0 0 0 3px #040405,0 0 0 5px var(--rx),0 0 40px #2fe08f66,0 30px 55px #000c,inset 0 -12px 20px #000}
.stage.rx .led{background:var(--rx);box-shadow:0 0 14px 3px var(--rx)}
.stage.busy .mic{filter:brightness(.6)}
.mic:disabled{opacity:.45}
#st{min-height:24px;font-size:15px;color:var(--mut);text-align:center}
/* ---- side ---- */
.side{width:350px;direction:rtl;display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line);transition:transform .3s}
.side h2{margin:0;padding:18px 18px 12px;font-size:18px}
.side h2 small{display:block;color:var(--gold);font-weight:500;font-size:12px;margin-top:3px}
#list{flex:1;overflow-y:auto;margin:0;padding:4px 12px;list-style:none;-webkit-overflow-scrolling:touch}
#list li{display:flex;gap:8px;align-items:center;padding:11px 10px;margin:8px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;border-right:4px solid var(--line)}
#list li.yes{border-right-color:var(--yes);background:#16251f}
#list li.no{border-right-color:var(--no);background:#2a1a1d}
.t{color:#1b1303;background:var(--gold);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700;direction:ltr;white-space:nowrap;flex:none}
.tt{flex:1;word-break:break-word;font-size:15px;min-width:0}
li.no .tt{text-decoration:line-through;color:var(--mut)}
.mk{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:none;color:var(--mut);font-size:18px;font-weight:800;line-height:1;cursor:pointer;flex:none;padding:0}
.mk.y.on{background:var(--yes);border-color:var(--yes);color:#04200f}
.mk.n.on{background:var(--no);border-color:var(--no);color:#fff}
.del{border:0;background:none;color:var(--mut);font-size:14px;padding:2px;cursor:pointer;opacity:.5;flex:none}
li.empty{justify-content:center;color:var(--mut);border-style:dashed!important;background:none!important;padding:28px 8px}
form.add{padding:12px 14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.picker{position:relative;direction:ltr;display:flex;justify-content:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.picker::before{content:"";position:absolute;left:8px;right:8px;top:40px;height:40px;border-radius:10px;background:#f2b53a22;border:1px solid #f2b53a66;pointer-events:none}
.picker::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--card),#0000 35%,#0000 65%,var(--card))}
.wheel{width:66px;height:120px;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-padding-top:40px;padding:40px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wheel::-webkit-scrollbar{display:none}
.wheel div{height:40px;line-height:40px;text-align:center;scroll-snap-align:start;font-size:19px;color:var(--mut);transition:color .15s,transform .15s}
.wheel div.on{color:var(--ink);font-weight:700;transform:scale(1.14)}
.colon{align-self:center;font-weight:700;color:var(--gold)}
#txt{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none;width:100%}
#txt:focus{border-color:var(--gold)}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;background:var(--gold);color:#1b1303;padding:13px 16px;cursor:pointer}
.tab{display:none}
@media (max-width:700px){
 .side{position:fixed;top:0;right:0;bottom:0;width:min(88vw,360px);z-index:20;transform:translateX(100%)}
 .side.open{transform:none;box-shadow:-20px 0 50px #0009}
 .tab{display:block;position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:30;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:9px 15px;font:inherit;font-size:14px}
 .main{padding-top:calc(20px + env(safe-area-inset-top,0px))}
}
</style>
</head>
<body>
<button class="tab" id="tab">📋 المهام</button>
<div class="app">
  <div class="main">
    <div class="chip" id="chip"><span class="dot"></span><span id="cs">Connecting…</span></div>
    <div class="stage" id="stage">
      <button class="mic" id="ptt" disabled aria-label="Ahmad Stkaozza"><span class="led"></span><span class="grille"></span><span class="ridge"><b>FBI</b></span></button>
      <svg class="cord" viewBox="0 0 60 100" aria-hidden="true"><path d="M30 46 C38 32 22 18 30 0" fill="none" stroke="#050506" stroke-width="5.5" stroke-linecap="round"/><path d="M28.6 46 C36.6 32 20.6 18 28.6 0" fill="none" stroke="#3b3f47" stroke-width="1" stroke-linecap="round"/><ellipse cx="30" cy="44" rx="15" ry="6.5" fill="none" stroke="#050506" stroke-width="5.5"/><path d="M16 43 a14 6 0 0 1 28 0" fill="none" stroke="#454a53" stroke-width="1.2" stroke-linecap="round"/><ellipse cx="30" cy="53" rx="15" ry="6.5" fill="none" stroke="#050506" stroke-width="5.5"/><path d="M16 52 a14 6 0 0 1 28 0" fill="none" stroke="#454a53" stroke-width="1.2" stroke-linecap="round"/><ellipse cx="30" cy="62" rx="15" ry="6.5" fill="none" stroke="#050506" stroke-width="5.5"/><path d="M16 61 a14 6 0 0 1 28 0" fill="none" stroke="#454a53" stroke-width="1.2" stroke-linecap="round"/><ellipse cx="30" cy="71" rx="15" ry="6.5" fill="none" stroke="#050506" stroke-width="5.5"/><path d="M16 70 a14 6 0 0 1 28 0" fill="none" stroke="#454a53" stroke-width="1.2" stroke-linecap="round"/><ellipse cx="30" cy="80" rx="15" ry="6.5" fill="none" stroke="#050506" stroke-width="5.5"/><path d="M16 79 a14 6 0 0 1 28 0" fill="none" stroke="#454a53" stroke-width="1.2" stroke-linecap="round"/><ellipse cx="30" cy="89" rx="15" ry="6.5" fill="none" stroke="#050506" stroke-width="5.5"/><path d="M16 88 a14 6 0 0 1 28 0" fill="none" stroke="#454a53" stroke-width="1.2" stroke-linecap="round"/><ellipse cx="30" cy="98" rx="15" ry="6.5" fill="none" stroke="#050506" stroke-width="5.5"/><path d="M16 97 a14 6 0 0 1 28 0" fill="none" stroke="#454a53" stroke-width="1.2" stroke-linecap="round"/></svg>
    </div>
    <div id="st">Ahmad Stkaozza</div>
  </div>
  <aside class="side" id="side">
    <h2>📋 جدول مهام اليوم<small id="dt"></small></h2>
    <ul id="list"><li class="empty">لا توجد مهام بعد</li></ul>
    <form class="add" id="f">
      <div class="picker"><div class="wheel" id="wh"></div><span class="colon">:</span><div class="wheel" id="wm"></div><div class="wheel" id="wp"></div></div>
      <input id="txt" placeholder="اكتب المهمة…" maxlength="120" required>
      <button class="btn" type="submit">إضافة مهمة</button>
    </form>
  </aside>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)},pad=function(n){return String(n).padStart(2,"0")};
var SR=16000,IDLE="Ahmad Stkaozza";
try{$("dt").textContent=new Date().toLocaleDateString("ar-SA",{weekday:"long",day:"numeric",month:"long"})}catch(e){}
$("tab").onclick=function(){var s=$("side").classList.toggle("open");$("tab").textContent=s?"✕ إغلاق":"📋 المهام"};

/* ---------- wheel picker ---------- */
function wheel(el,items,init){
  el.innerHTML="";items.forEach(function(t){var d=document.createElement("div");d.textContent=t;el.appendChild(d)});
  var k=el.children,last=-1,raf=0;
  function mark(){var i=Math.max(0,Math.min(k.length-1,Math.round(el.scrollTop/40)));if(i!==last){if(k[last])k[last].classList.remove("on");k[i].classList.add("on");last=i}}
  el.addEventListener("scroll",function(){cancelAnimationFrame(raf);raf=requestAnimationFrame(mark)},{passive:true});
  el.scrollTop=init*40;mark();
  return function(){return Math.max(0,Math.min(k.length-1,Math.round(el.scrollTop/40)))};
}
var hrs=[],mins=[],i;for(i=1;i<=12;i++)hrs.push(i);for(i=0;i<60;i++)mins.push(pad(i));
var n0=new Date(),gH,gM,gP;
function initW(){gH=wheel($("wh"),hrs,(n0.getHours()%12||12)-1);gM=wheel($("wm"),mins,n0.getMinutes());gP=wheel($("wp"),["ص","م"],n0.getHours()>=12?1:0)}
initW();setTimeout(initW,80);
function picked(){var h=gH()+1,pm=gP()===1;return pad((h%12)+(pm?12:0))+":"+mins[gM()]}
function fmt(t){var p=(t||"00:00").split(":"),h=+p[0];return (h%12||12)+":"+p[1]+" "+(h>=12?"م":"ص")}

/* ---------- websocket + tasks ---------- */
var ws=null,connected=false,list=$("list"),st=$("st"),stage=$("stage"),ptt=$("ptt");
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function renderTasks(ts){
  list.textContent="";
  if(!ts.length){var e=document.createElement("li");e.className="empty";e.textContent="لا توجد مهام بعد";list.appendChild(e);return}
  ts.slice().sort(function(a,b){return a.time.localeCompare(b.time)}).forEach(function(t){
    var li=document.createElement("li");if(t.s)li.className=t.s;
    var tm=document.createElement("span");tm.className="t";tm.textContent=fmt(t.time);
    var tx=document.createElement("span");tx.className="tt";tx.textContent=t.text;
    var y=document.createElement("button");y.type="button";y.className="mk y"+(t.s==="yes"?" on":"");y.textContent="✓";y.setAttribute("aria-label","تمت");y.onclick=function(){send({t:"mark",id:t.id,v:"yes"})};
    var n=document.createElement("button");n.type="button";n.className="mk n"+(t.s==="no"?" on":"");n.textContent="✕";n.setAttribute("aria-label","لم تتم");n.onclick=function(){send({t:"mark",id:t.id,v:"no"})};
    var d=document.createElement("button");d.type="button";d.className="del";d.textContent="🗑";d.onclick=function(){send({t:"del",id:t.id})};
    li.append(tm,tx,y,n,d);list.appendChild(li);
  });
}
$("f").addEventListener("submit",function(e){e.preventDefault();var v=$("txt").value.trim();if(!v)return;send({t:"add",time:picked(),text:v});$("txt").value=""});

var retry=0;
function connect(){
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
  ws.binaryType="arraybuffer";
  ws.onopen=function(){connected=true;retry=0;ptt.disabled=false;$("chip").classList.add("on");$("cs").textContent="Connected"};
  ws.onclose=function(){connected=false;ptt.disabled=true;$("chip").classList.remove("on");$("cs").textContent="Reconnecting…";stopTalking(true);setTimeout(connect,Math.min(5000,500+retry++*700))};
  ws.onmessage=function(ev){
    if(typeof ev.data!=="string"){playChunk(ev.data);return}
    var m;try{m=JSON.parse(ev.data)}catch(e){return}
    if(m.t==="tasks")renderTasks(m.tasks);
    else if(m.t==="talk")m.on?rxStart():rxEnd();
    else if(m.t==="grant")onGrant();
    else if(m.t==="busy"){killAlert();holding=false;wantTalk=false;stage.classList.remove("tx");st.textContent="القناة مشغولة";stage.classList.add("busy");setTimeout(function(){stage.classList.remove("busy");st.textContent=IDLE},1200)}
    else if(m.t==="timeout")stopTalking(false);
  };
}

/* ---------- audio ---------- */
var AC=window.AudioContext||window.webkitAudioContext,ctx=AC?new AC():null,stream=null,sending=false,playHead=0;
var alertBuf=null,toneLen=1;
var unlocked=false,keep=null;
function unlock(){
  if(!ctx)return;
  try{if(navigator.audioSession)navigator.audioSession.type="play-and-record"}catch(e){}
  if(ctx.state!=="running")ctx.resume();
  if(!unlocked){try{var b=ctx.createBuffer(1,1,22050),sn=ctx.createBufferSource();sn.buffer=b;sn.connect(ctx.destination);sn.start(0);unlocked=true}catch(e){}}
  if(!keep){try{keep=new Audio("data:audio/wav;base64,UklGRmQGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YUAGAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA");keep.loop=true;var p=keep.play();if(p&&p.catch)p.catch(function(){keep=null})}catch(e){keep=null}}
}
function ensure(){unlock();return ctx}

    for(var i=0;i<4;i++){var fr=i%2?740:1046;o.frequency.setValueAtTime(fr,at+i*.25);o2.frequency.setValueAtTime(fr*2,at+i*.25)}
    g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(.2,at+.03);g.gain.setValueAtTime(.2,at+.92);g.gain.linearRampToValueAtTime(0,at+1);
    o.start(at);o2.start(at);o.stop(at+1.02);o2.stop(at+1.02);n.push(o,o2);
  }
  return n;
}
function endBeep(at){var o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=1500;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(.15,at+.01);g.gain.linearRampToValueAtTime(0,at+.12);o.start(at);o.stop(at+.14)}
function openMic(){
  if(stream)return Promise.resolve();
  return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}}).then(function(s){
    stream=s;s.getAudioTracks().forEach(function(t){t.enabled=false});
    var src=ctx.createMediaStreamSource(s),proc=ctx.createScriptProcessor(2048,1,1),mute=ctx.createGain();
    mute.gain.value=0;src.connect(proc);proc.connect(mute);mute.connect(ctx.destination);
    var ratio=ctx.sampleRate/SR;
    proc.onaudioprocess=function(e){
      if(!sending||!ws||ws.readyState!==1)return;
      var inp=e.inputBuffer.getChannelData(0),n=Math.floor(inp.length/ratio),out=new Int16Array(n);
      for(var i=0;i<n;i++){var a=Math.floor(i*ratio),b=Math.max(a+1,Math.floor((i+1)*ratio)),s=0,c=0;for(var j=a;j<b&&j<inp.length;j++){s+=inp[j];c++}
        var v=c?s/c:0;if(v>1)v=1;if(v<-1)v=-1;out[i]=v*32767}
      ws.send(out.buffer);
    };
  });
}
var rxOn=false;
function playChunk(ab){
  if(!ctx||!rxOn)return;
  var i16=new Int16Array(ab),n=i16.length;if(!n)return;
  var buf=ctx.createBuffer(1,n,SR),ch=buf.getChannelData(0);for(var i=0;i<n;i++)ch[i]=i16[i]/32768;
  var src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);
  var now=ctx.currentTime;if(playHead<now+.03)playHead=now+.14;
  src.start(playHead);playHead+=buf.duration;
}
function rxStart(){
  if(!ensure())return;
  rxOn=true;playAlert(ctx.currentTime+.02);playHead=ctx.currentTime+toneLen+.08;
  stage.classList.add("rx");st.textContent="🔊 يتحدث شخص";
}
function rxEnd(){
  if(!ctx)return;rxOn=false;var wait=Math.max(0,playHead-ctx.currentTime);
  endBeep(playHead+.05);
  setTimeout(function(){if(!rxOn){stage.classList.remove("rx");st.textContent=IDLE}},wait*1000+250);
}

/* ---------- push to talk ---------- */
var holding=false,wantTalk=false,seq=0,tNodes=null,downAt=0;
function killAlert(){if(tNodes){tNodes.forEach(function(o){try{o.stop()}catch(e){}});tNodes=null}}
function down(e){
  e.preventDefault();
  if(holding||!connected||rxOn||!ensure())return;
  holding=true;wantTalk=true;downAt=performance.now();
  stage.classList.add("tx");st.textContent="📡 …";
  tNodes=playAlert(ctx.currentTime+.01); // the alert plays instantly on press
  openMic().then(function(){if(holding)send({t:"start"})}).catch(function(){killAlert();holding=false;wantTalk=false;seq++;stage.classList.remove("tx");st.textContent="اسمح باستخدام المايكروفون من إعدادات المتصفح"});
}
function onGrant(){
  if(!wantTalk){send({t:"end"});return}
  var my=++seq,wait=Math.max(0,toneLen*1000+30-(performance.now()-downAt));
  setTimeout(function(){
    if(!holding||my!==seq)return;
    stream.getAudioTracks().forEach(function(t){t.enabled=true});sending=true;
    st.textContent="🔴 تكلّم الآن";
  },wait);
}
function stopTalking(silent){
  var was=holding;holding=false;wantTalk=false;seq++;
  var wasSending=sending;sending=false;
  if(stream)stream.getAudioTracks().forEach(function(t){t.enabled=false});
  stage.classList.remove("tx");
  if(!was)return;
  if(tNodes&&!wasSending){tNodes.forEach(function(o){try{o.stop()}catch(e){}})}
  if(wasSending&&ctx)endBeep(ctx.currentTime+.02);
  if(!silent){send({t:"end"});st.textContent=wasSending?"✅ تم الإرسال":IDLE}
}
ptt.addEventListener("pointerdown",down);
["pointerup","pointercancel"].forEach(function(n){ptt.addEventListener(n,function(){stopTalking(false)});window.addEventListener(n,function(){if(holding)stopTalking(false)})});
ptt.addEventListener("contextmenu",function(e){e.preventDefault()});

/* ---------- start (no login screen) ---------- */
connect();
// iPhone/Chrome only allow sound after a touch: unlock on the first tap anywhere
["pointerdown","pointerup","touchend","click"].forEach(function(n){document.addEventListener(n,function(){ensure();if(st.textContent.indexOf("المس")===0)st.textContent=IDLE},true)});
document.addEventListener("visibilitychange",function(){if(!document.hidden)ensure()});
setTimeout(function(){if(ctx&&ctx.state!=="running"&&!holding&&!rxOn)st.textContent="المس الشاشة لتفعيل الصوت"},700);
})();
</script>
</body>
